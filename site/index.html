<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ski areas above 2,000 m</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Source+Sans+3:wght@400;600&display=swap">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="shared.css">
<style>
  #areas th, #areas td { text-align: right; }
  #areas .c-fav, #areas .c-cmp, #areas .c-name { position: sticky; background: var(--surface); z-index: 1; }
  #areas { --fav-w: 40px; --cmp-w: 64px; }
  #areas .c-fav, #areas .c-cmp { text-align: center; padding-inline: 4px; }
  #areas .c-fav { left: 0; width: var(--fav-w); min-width: var(--fav-w); max-width: var(--fav-w); }
  #areas .c-cmp { left: var(--fav-w); width: var(--cmp-w); min-width: var(--cmp-w); max-width: var(--cmp-w); }
  #areas .c-name { left: calc(var(--fav-w) + var(--cmp-w)); text-align: left; border-right: 1px solid var(--line); }
  #areas td.c-name { white-space: normal; min-width: 150px; max-width: 240px; overflow-wrap: anywhere; }
  #areas .price-cell { white-space: nowrap; }
  #areas .price-per-km { color: var(--muted); font-size: 11px; }
  #areas thead .c-cmp { font-size: 10px; letter-spacing: 0; }
  #areas input[type="checkbox"] { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); cursor: pointer; }
  #areas thead tr:first-child th { border-bottom: 0; padding-bottom: 0; }
  #areas tbody tr:hover td { background: var(--bg); }
  th.group { text-align: center !important; }
  th.group span { display: inline-flex; align-items: center; gap: 6px; }
  .start { border-left: 1px solid var(--line); }
  th.left, td.country { text-align: left !important; }
  td.country { color: var(--muted); white-space: normal; }
  td a.name { font-weight: 600; }
  #areas { --child-tint: color-mix(in srgb, var(--accent) 7%, var(--surface)); }
  #areas tr.expanded td, #areas tr.village td { background: var(--child-tint); }
  #areas tr.expanded td { border-bottom-color: transparent; }
  #areas tr.village td.c-name { padding-left: 36px; box-shadow: inset 3px 0 var(--accent); }
  #areas tr.village td.c-name a.name { font-weight: 400; }
  #areas tr.village td.c-name a.name::before { content: "└ "; content: "└ " / ""; color: var(--muted); margin-left: -16px; }
  #areas tr.village.last-child td { border-bottom: 2px solid var(--line); }
  .village-toggle { display: block; margin-top: 4px; padding: 2px 0; font: inherit; font-size: 12px; color: var(--accent); background: none; border: 0; cursor: pointer; text-align: left; }
  .area-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 10px; font-size: 12px; color: var(--muted); }
  .area-meta a { color: var(--accent); }
  .bar { display: block; height: 6px; margin-top: 4px; border-radius: 3px; background: var(--low); overflow: hidden; margin-left: auto; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .lead { margin: 6px 0 0; max-width: 70ch; font-size: 17px; line-height: 1.5; color: var(--muted); }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; min-width: 0; }
  .filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr)); gap: 16px 20px; align-items: end; }
  .field { display: grid; gap: 6px; min-width: 0; font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
  .field > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .field input[type="search"], .multi summary {
    height: 36px; width: 100%; font: inherit; font-size: 15px; font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--fg);
    background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 6px 10px; min-width: 0;
  }
  .field input[type="range"] { height: 36px; width: 100%; margin: 0; accent-color: var(--accent); }
  .filter-end { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 12px; min-height: 36px; }
  .check { display: inline-flex; align-items: center; gap: 8px; font-size: 15px; cursor: pointer; }
  .check input { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); }
  .text-btn { font: inherit; font-size: 13px; color: var(--accent); background: none; border: 0; padding: 4px; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
  .text-btn[hidden] { display: none; }
  .multi { position: relative; }
  .multi summary { list-style: none; cursor: pointer; padding-right: 30px; position: relative; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .multi summary::-webkit-details-marker { display: none; }
  .multi summary::after { content: "▾"; position: absolute; right: 10px; color: var(--muted); }
  .multi-panel {
    position: absolute; z-index: 5; top: calc(100% + 4px); left: 0; width: min(300px, calc(100vw - 32px));
    background: var(--surface); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 6px 20px rgb(0 0 0 / .15);
    padding: 8px; display: grid; gap: 6px; text-transform: none; letter-spacing: 0;
  }
  .multi-panel > button { justify-self: start; font: inherit; font-size: 13px; color: var(--accent); background: none; border: 0; padding: 2px 4px; cursor: pointer; }
  .multi-list { max-height: 320px; overflow-y: auto; display: grid; }
  .multi-list label { display: flex; align-items: center; gap: 8px; padding: 4px; border-radius: 4px; cursor: pointer; font-size: 14px; color: var(--fg); }
  .multi-list label:hover { background: var(--bg); }
  .multi-list small { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
  .compare-bar {
    position: fixed; z-index: 10; left: 0; right: 0; bottom: 0;
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px;
    padding: 10px max(16px, env(safe-area-inset-right, 0px)) max(10px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    background: var(--surface); border: 0; border-top: 1px solid var(--line); border-radius: 0; box-shadow: 0 -2px 8px rgb(0 0 0 / .12);
    transform: translateY(100%); opacity: 0; visibility: hidden;
    transition: transform .2s ease-out, opacity .2s ease-out, visibility 0s .2s;
  }
  .compare-bar.is-open { transform: none; opacity: 1; visibility: visible; transition: transform .2s ease-out, opacity .2s ease-out; }
  .selection-area { flex: 1 1 260px; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
  .compare-help { margin: 0; font-size: 14px; color: var(--muted); }
  .compare-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-left: auto; }
  .compare-btn { height: 36px; font: inherit; font-size: 14px; font-weight: 600; padding: 0 14px; border-radius: 4px; border: 1px solid var(--accent); background: var(--accent); color: var(--bg); cursor: pointer; }
  .compare-btn:disabled { opacity: .45; cursor: not-allowed; }
  .selection { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; margin: 0; padding: 0; }
  .selection:empty { display: none; }
  @media (max-width: 520px) {
    .compare-bar { padding-top: 8px; }
    .selection-area { flex-basis: 100%; gap: 4px; }
    .selection { flex-wrap: nowrap; overflow-x: auto; max-width: 100%; padding-bottom: 2px; }
    .selection .chip { flex: none; }
    .compare-help { font-size: 13px; }
    .compare-actions { width: 100%; }
    .compare-btn { flex: 1; }
  }
  .chip { display: inline-flex; align-items: center; gap: 2px; font-size: 13px; padding: 2px 2px 2px 10px; border: 1px solid var(--accent); border-radius: 999px; background: var(--surface); color: var(--fg); }
  .chip.is-hidden { border-style: dashed; border-color: var(--line); color: var(--muted); }
  .chip button { font: inherit; line-height: 1; padding: 2px 6px; border: 0; border-radius: 999px; background: none; color: inherit; cursor: pointer; }
  .chip button:hover { background: var(--bg); }
  .results { display: grid; gap: 8px; min-width: 0; }
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 18px; }
  .count-line { display: inline-flex; align-items: center; gap: 8px; }
  #areas td:has(.info-btn[aria-expanded="true"]) { z-index: 3; }
  .count { font-size: 14px; font-weight: 600; color: var(--fg); }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend b { width: 18px; height: 6px; border-radius: 3px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <span class="eyebrow" data-i18n="eyebrow"></span>
    <div class="lang" data-lang-switch></div>
  </div>
  <header>
    <h1 data-i18n="siteTitle"></h1>
    <p class="lead" data-i18n="intro"></p>
  </header>
  <div class="panel filters">
    <label class="field"><span data-i18n="searchLabel"></span><input id="search" type="search" autocomplete="off" data-i18n-placeholder="searchPlaceholder"></label>
    <div class="field">
      <span id="country-label" data-i18n="countries"></span>
      <details class="multi" id="country-picker">
        <summary id="country-summary" aria-labelledby="country-label country-summary"></summary>
        <div class="multi-panel">
          <button type="button" id="country-clear" data-i18n="clearSelection"></button>
          <div class="multi-list" id="country-list" role="group" aria-labelledby="country-label"></div>
        </div>
      </details>
    </div>
    <label class="field"><span id="min-label"></span><input id="min" type="range" min="0" value="0"></label>
    <label class="field"><span id="max-price-label"></span><input id="max-price" type="range" min="0" value="0"></label>
    <div class="filter-end">
      <label class="check"><input id="fav" type="checkbox"><span data-i18n="favOnly"></span></label>
      <button type="button" class="text-btn" id="reset-filters" data-i18n="resetFilters" hidden></button>
    </div>
  </div>
  <div class="panel compare-bar" id="compare-bar">
    <div class="selection-area">
      <ul class="selection" id="selection"></ul>
      <p class="compare-help" id="compare-help" data-i18n="compareLimit"></p>
    </div>
    <div class="compare-actions">
      <button type="button" class="text-btn" id="selection-clear" data-i18n="clearSelection" hidden></button>
      <button type="button" class="compare-btn" id="compare" aria-describedby="compare-help"></button>
    </div>
  </div>
  <div class="results">
    <div class="toolbar">
      <span class="count-line" id="count-line"><span class="count" id="count" aria-live="polite"></span></span>
      <div class="legend">
        <span><b style="background: var(--accent)"></b><span data-i18n="legendHigh"></span></span>
        <span><b style="background: var(--low)"></b><span data-i18n="legendLow"></span></span>
      </div>
    </div>
    <div class="table-box" id="table-box">
      <table id="areas">
        <thead id="head"></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div id="pager"></div>
  </div>
  <footer></footer>
</div>
<script src="i18n.js"></script>
<script src="common.js"></script>
<script src="favourites.js"></script>
<script src="price.js"></script>
<script src="url-state.js"></script>
<script src="compare-targets.js"></script>
<script src="paging.js"></script>
<script src="summary.js"></script>
</body>
</html>
