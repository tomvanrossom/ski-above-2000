<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Compare ski areas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Source+Sans+3:wght@400;600&display=swap">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1f5f8b">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="shared.css">
<style>
  #compare th[scope="row"] { text-transform: none; letter-spacing: 0; font-size: 14px; position: sticky; left: 0; background: var(--surface); }
  #compare { --label-w: 190px; --area-w: 230px; table-layout: fixed; }
  #compare col.label-col { width: var(--label-w); }
  #compare thead th { font-size: 16px; text-transform: none; letter-spacing: 0; color: var(--fg); white-space: normal; overflow-wrap: anywhere; vertical-align: bottom; text-align: center; }
  #compare thead th a { color: var(--accent); }
  #compare thead tr.sub th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); text-align: right; vertical-align: top; white-space: normal; overflow-wrap: normal; }
  #compare .start { border-left: 1px solid var(--line); }
  #compare td { text-align: right; }
  #compare td.rose-cell { text-align: center; }
  #compare td.rose-cell img { width: 160px; max-width: 100%; height: auto; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
  #compare td.map-cell { padding: 6px; }
  .cmp-map { height: 320px; border: 1px solid var(--line); border-radius: 6px; z-index: 0; }
  .map-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 10px; font-size: 13px; color: var(--muted); }
  .map-legend i { display: inline-block; width: 22px; height: 0; vertical-align: middle; margin-right: 6px; }
  .map-popup b { display: block; }
  #compare .colour { display: inline-flex; align-items: center; gap: 6px; }
  #compare td.best { font-weight: 700; color: var(--fg); background: color-mix(in srgb, var(--accent) 16%, var(--surface)); box-shadow: inset 3px 0 0 var(--accent); }
</style>
</head>
<body>
<div class="wrap narrow">
  <div class="topbar">
    <a id="back" href="index.html" data-i18n="backToSummary"></a>
    <div class="lang" data-lang-switch></div>
  </div>
  <header><h1 data-i18n="compareTitle"></h1></header>
  <main id="main"></main>
  <footer></footer>
</div>
<script src="i18n.js"></script>
<script src="common.js"></script>
<script src="favourites.js"></script>
<script src="best-value.js?v=4"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="area-map.js"></script>
<script src="compare.js?v=10"></script>
</body>
</html>
